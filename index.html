<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1113" />
    <!-- The logo already ships with the bundle. Naming it here stops every
         page load from requesting a favicon that does not exist.

         Square on purpose. The previous file was named for 512 pixels but
         measured 150x41 — a horizontal wordmark — so the browser crushed it
         into a 16x16 tab icon and no CSS could have saved it. -->
    <link rel="icon" type="image/png" href="/operations-icon.png" />
    <link rel="apple-touch-icon" href="/operations-icon.png" />
    <meta
      name="description"
      content="Operations Suite: plataforma de producción para Clean Vector PRO y Sep Maker PRO."
    />
    <title>Operations Suite</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
